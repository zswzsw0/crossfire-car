# 穿越火线参数。放在程序同目录，或启动时的当前目录。
# 改完不用重新编译。命令行 --no-drive / --force-card / --uart / --cam 会覆盖这里。

# 串口与相机。久久派示例默认 /dev/ttyUSB0；若板子上是 udev 名则改成 /dev/deepbotbase
uart=/dev/ttyUSB0
camera_id=0
stream_enable=true
stream_port=9999
hsv_file=hsv_saved.txt

# true 才给底盘发速度；调试画面时改 false
enable_drive=true
# true 时终端按 b/r 可强制蓝/红色卡（比赛建议 false）
allow_force_card=false
# true：航向用陀螺仪 z（与 ROS 里 /odom 的 EKF 一致）；false：用底盘编码器角速度
use_gyro_yaw=true

# 上半幅忽略比例，只在地面区域找黑点和锥桶
roi_y_top=0.45

# 色卡：颜色像素占整幅画面的比例、连续帧数、主色相对另一色的倍数
card_fill_ratio=0.50
card_confirm_frames=12
card_dominance=1.50

# 黑点面积（像素）。与 beacon_race.launch 一致
min_black_area=40
max_black_area=700

# 红锥：A 路（蓝卡）右转，B 路（红卡）左转
red_cone_min_area=200
red_cone_max_area=8000
red_avoid_wz=0.45
red_avoid_vx=0.08

# 蓝锥：只有落在黑点连线上才轻避，转向比红锥小
blue_cone_min_area=240
blue_cone_max_area=8000
blue_avoid_wz=0.20
blue_avoid_vx=0.10
blue_on_track_dist_px=40

# 据点 / 终点，单位米。起点是程序启动时的车位，车头为 +X，左侧为 +Y
blue_base_x=1.0
blue_base_y=0.9
red_base_x=1.0
red_base_y=-0.9
blue_goal_x=7.0
blue_goal_y=-0.9
red_goal_x=7.0
red_goal_y=0.9

# 速度与到达阈值，与 beacon_race.py 一致
vel_x_odom=0.60
vel_x_vision=0.15
vel_z_max=0.55
yaw_p=1.2
pos_p=0.8
goal_pos_tol=0.25
goal_yaw_tol=0.15
base_wait_sec=3.0
near_goal_dist=1.80
vis_wz_gain=0.008
odom_blend=0.35
